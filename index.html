<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EgononAI — Portafogli Modello</title>
<style>
  :root{
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e;
    --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
    --border:rgba(11,11,11,.10);
    --s1:#2a78d6; --neg:#e34948; --good:#006300;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7;
      --muted:#898781; --grid:#2c2c2a; --axis:#383835;
      --border:rgba(255,255,255,.10);
      --s1:#3987e5; --neg:#e66767; --good:#0ca30c;
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7;
    --muted:#898781; --grid:#2c2c2a; --axis:#383835;
    --border:rgba(255,255,255,.10);
    --s1:#3987e5; --neg:#e66767; --good:#0ca30c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
       font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:1060px;margin:0 auto;padding:28px 20px 60px}
  header h1{font-size:26px;margin:0 0 2px}
  header p{color:var(--ink2);margin:0 0 6px}
  .pill{display:inline-block;font-size:12px;color:var(--ink2);
        border:1px solid var(--border);border-radius:999px;padding:2px 10px;margin:2px 0 18px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:26px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .card h3{margin:0 0 2px;font-size:15px}
  .card .ccy{color:var(--muted);font-size:12px}
  .card .big{font-size:22px;margin-top:6px}
  .card .soon{color:var(--muted);font-size:13px;margin-top:8px}
  .badge{display:inline-block;font-size:11px;border:1px solid var(--border);
         border-radius:999px;padding:1px 8px;margin-right:4px;color:var(--ink2)}
  .badge.etf{color:var(--good);border-color:var(--good)}
  .up{color:var(--good)} .down{color:var(--neg)}
  h2{font-size:19px;margin:30px 0 10px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px}
  .tile .k{font-size:12px;color:var(--ink2)}
  .tile .v{font-size:20px;margin-top:2px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:14px;position:relative}
  .panel h3{margin:0 0 8px;font-size:14px;color:var(--ink2);font-weight:600}
  svg{display:block;width:100%;height:auto}
  .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);
       border-radius:8px;padding:6px 9px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.12);
       display:none;white-space:nowrap;z-index:2}
  .tip b{font-variant-numeric:tabular-nums}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{color:var(--ink2);font-weight:600;text-align:left;border-bottom:1px solid var(--axis);padding:6px 8px}
  td{border-bottom:1px solid var(--grid);padding:5px 8px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .foot{color:var(--muted);font-size:12.5px;margin-top:26px}
  .method{color:var(--ink2);font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>EgononAI</h1>
    <p>Portafogli modello quantitativi — ricerca sui colli di bottiglia strutturali</p>
    <span class="pill">Ricerca · non è consulenza finanziaria · metodologia dichiarata</span>
  </header>

  <div class="cards" id="cards"></div>
  <section id="detail"></section>
  <p class="foot" id="foot"></p>
</div>

<script>
const fmtPct = v => (v>0?"+":"") + v.toFixed(2).replace(".",",") + "%";
const fmtNum = v => v.toLocaleString("it-IT");
const cls = v => v >= 0 ? "up" : "down";

const RISK_LABEL = {basso:"rischio basso", medio:"rischio medio",
                    "medio-alto":"rischio medio-alto", alto:"rischio alto",
                    istituzionale:"profilo istituzionale"};

async function main(){
  const reg = await (await fetch("data/registry.json")).json();
  const cards = document.getElementById("cards");
  for(const p of reg.portfolios){
    const c = document.createElement("div"); c.className = "card";
    const badges = `<div style="margin-top:4px">
      <span class="badge">${RISK_LABEL[p.risk_level]||""}</span>
      ${p.etf_only?'<span class="badge etf">100% ETF</span>':""}</div>`;
    if(p.metrics){
      c.innerHTML = `<h3>${p.label}</h3><span class="ccy">${p.base_currency} · live · al ${p.asof}</span>
        ${badges}<div class="big ${cls(p.metrics.perf_total_pct)}">${fmtPct(p.metrics.perf_total_pct)}</div>
        <div class="ccy">da inception · NAV ${fmtNum(p.metrics.nav_last)}</div>`;
    } else {
      c.innerHTML = `<h3>${p.label}</h3><span class="ccy">${p.base_currency} · live</span>
        ${badges}<div class="soon">Track dal ${p.inception} — vol ex-ante
        ${String(p.ex_ante?.vol_ann_pct??"").replace(".",",")}%</div>`;
    }
    cards.appendChild(c);
  }
  const ids = reg.portfolios.map(p => p.portfolio);
  for(const id of ids){
    const d = await (await fetch(`data/${id}.json`)).json();
    renderDetail(d);
  }
  document.getElementById("foot").textContent =
    reg.disclaimer + " · Generato " + reg.generated + " · © EgononAI";
}

function renderDetail(d){
  const sec = document.createElement("section");
  const uid = d.portfolio;
  const baseCap = d.portfolio === "wolf43" ? "1.000.000" : "100.000";
  let tiles;
  if(d.metrics){
    tiles = `
      ${tile("Performance da inception", fmtPct(d.metrics.perf_total_pct), cls(d.metrics.perf_total_pct))}
      ${tile("NAV (base "+baseCap+")", fmtNum(d.metrics.nav_last))}
      ${tile("Volatilità ann.", fmtPct(d.metrics.vol_ann_pct).replace("+",""))}
      ${tile("Sharpe", String(d.metrics.sharpe).replace(".",","))}
      ${tile("Max drawdown", fmtPct(d.metrics.max_dd_pct), "down")}
      ${tile("VaR95 (1 settimana)", fmtPct(d.metrics.var95_1w_pct).replace("+",""))}`;
  } else {
    const bt = d.ex_ante.backtest_3y;
    tiles = `
      ${tile("Vol ex-ante", fmtPct(d.ex_ante.vol_ann_pct).replace("+",""))}
      ${tile("VaR95 1w ex-ante", fmtPct(d.ex_ante.var95_1w_pct).replace("+",""))}
      ${tile("Backtest 3a: perf ann*", fmtPct(bt.perf_ann_pct), cls(bt.perf_ann_pct))}
      ${tile("Backtest 3a: max DD*", fmtPct(bt.max_dd_pct), "down")}
      ${tile("Backtest 3a: Sharpe*", String(bt.sharpe).replace(".",","))}
      ${tile("Cassa", String(d.cash_pct).replace(".",",")+"%")}`;
  }
  sec.innerHTML = `<h2>${d.label} <span class="ccy" style="font-size:13px;color:var(--muted)">
    ${d.base_currency} · ${RISK_LABEL[d.risk_level]||""}${d.etf_only?" · 100% ETF":""}
    · inception ${d.inception} · dati al ${d.asof}</span></h2>
    <div class="tiles">${tiles}</div>
    ${d.metrics? "" : `<p class="method">* Backtest indicativo sui pesi correnti:
      NON è un track record. Il track live parte il ${d.inception}.</p>`}
    ${d.nav_weekly.length>1?`<div class="panel" id="nav_${uid}">
      <h3>Curva NAV (settimanale, ${d.base_currency})</h3></div>`:""}
    ${Object.keys(d.monthly_pct).length>0?`<div class="panel" id="mo_${uid}">
      <h3>Rendimenti mensili</h3></div>`:""}
    <div class="panel"><h3>Metodologia</h3><p class="method">${d.methodology}</p></div>
    <div class="panel"><h3>Composizione (${d.holdings.length} posizioni)</h3>
      <div style="overflow-x:auto">${holdingsTable(d.holdings)}</div></div>`;
  document.getElementById("detail").appendChild(sec);
  if(d.nav_weekly.length>1) lineChart(sec.querySelector(`#nav_${uid}`), d.nav_weekly);
  if(Object.keys(d.monthly_pct).length>0) barChart(sec.querySelector(`#mo_${uid}`), d.monthly_pct);
}

const tile = (k,v,c="") =>
  `<div class="tile"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`;

function holdingsTable(hs){
  const isW43 = "weight_base_pct" in (hs[0]||{});
  if(isW43){
    const rows = hs.map(h => `<tr><td>${h.name}</td><td>${h.bucket}</td><td>${h.role}</td>
       <td>${h.ccy}</td><td class="num">${h.weight_base_pct.toFixed(2).replace(".",",")}</td>
       <td class="num">${h.weight_now_pct.toFixed(2).replace(".",",")}</td></tr>`).join("");
    return `<table><thead><tr><th>Titolo</th><th>Bucket</th><th>Ruolo</th><th>Val.</th>
      <th class="num">Peso base %</th><th class="num">Peso attuale %</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }
  const rows = hs.map(h => `<tr><td>${h.name}</td><td>${h.asset_class}</td>
     <td>${h.kind.toUpperCase()}</td><td>${h.ccy}</td>
     <td class="num">${h.weight_pct.toFixed(2).replace(".",",")}</td></tr>`).join("");
  return `<table><thead><tr><th>Strumento</th><th>Classe</th><th>Tipo</th><th>Val.</th>
    <th class="num">Peso %</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function lineChart(panel, series){
  const W=980, H=300, m={t:12,r:14,b:26,l:64};
  const xs = series.map(p=>new Date(p[0]).getTime());
  const ys = series.map(p=>p[1]);
  const x0=Math.min(...xs), x1=Math.max(...xs);
  const yMin=Math.min(...ys)*0.99, yMax=Math.max(...ys)*1.01;
  const X = t=>m.l+(t-x0)/(x1-x0)*(W-m.l-m.r);
  const Y = v=>H-m.b-(v-yMin)/(yMax-yMin)*(H-m.t-m.b);
  let grid="", labels="";
  for(let i=0;i<=4;i++){
    const v=yMin+(yMax-yMin)*i/4, y=Y(v);
    grid+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    labels+=`<text x="${m.l-8}" y="${y+4}" text-anchor="end" font-size="11"
      fill="var(--muted)" font-variant-numeric="tabular-nums">${Math.round(v/1000)}k</text>`;
  }
  const months={};
  series.forEach(p=>{const k=p[0].slice(0,7); if(!(k in months)) months[k]=X(new Date(p[0]).getTime());});
  for(const [k,x] of Object.entries(months))
    labels+=`<text x="${x}" y="${H-8}" font-size="11" fill="var(--muted)">${k.slice(5)}/${k.slice(2,4)}</text>`;
  const path = series.map((p,i)=>(i?"L":"M")+X(new Date(p[0]).getTime()).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  panel.insertAdjacentHTML("beforeend",
    `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Curva NAV">
      ${grid}${labels}
      <line x1="${m.l}" x2="${W-m.r}" y1="${H-m.b}" y2="${H-m.b}" stroke="var(--axis)"/>
      <path d="${path}" fill="none" stroke="var(--s1)" stroke-width="2"/>
      <line id="ch" y1="${m.t}" y2="${H-m.b}" stroke="var(--axis)" stroke-dasharray="3 3" style="display:none"/>
      <circle id="dot" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" style="display:none"/>
      <rect x="${m.l}" y="${m.t}" width="${W-m.l-m.r}" height="${H-m.t-m.b}" fill="transparent" id="hov"/>
    </svg><div class="tip" id="navTip"></div>`);
  const svg=panel.querySelector("svg"), tip=panel.querySelector("#navTip"),
        ch=svg.querySelector("#ch"), dot=svg.querySelector("#dot");
  svg.querySelector("#hov").addEventListener("mousemove",e=>{
    const r=svg.getBoundingClientRect(), px=(e.clientX-r.left)*(W/r.width);
    let best=0,bd=1e18;
    series.forEach((p,i)=>{const d=Math.abs(X(new Date(p[0]).getTime())-px); if(d<bd){bd=d;best=i;}});
    const p=series[best], x=X(new Date(p[0]).getTime()), y=Y(p[1]);
    ch.setAttribute("x1",x); ch.setAttribute("x2",x); ch.style.display="block";
    dot.setAttribute("cx",x); dot.setAttribute("cy",y); dot.style.display="block";
    tip.style.display="block";
    tip.style.left=Math.min(x/W*r.width+12, r.width-150)+"px";
    tip.style.top=(y/H*r.height-34)+"px";
    tip.innerHTML=`${p[0]} · <b>${fmtNum(p[1])} €</b>`;
  });
  svg.addEventListener("mouseleave",()=>{tip.style.display="none";ch.style.display="none";dot.style.display="none";});
}

function barChart(panel, monthly){
  const entries=Object.entries(monthly);
  const W=980, H=240, m={t:14,r:14,b:26,l:64};
  const vals=entries.map(e=>e[1]);
  const lim=Math.max(...vals.map(Math.abs))*1.15;
  const Y=v=>{const h=H-m.t-m.b; return m.t+h/2-(v/lim)*(h/2);};
  const bw=Math.min(56,(W-m.l-m.r)/entries.length-8);
  let bars="",labels="",grid="";
  [-lim,-lim/2,0,lim/2,lim].forEach(v=>{
    const y=Y(v);
    grid+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"
      stroke="${v===0?"var(--axis)":"var(--grid)"}" stroke-width="1"/>`;
    labels+=`<text x="${m.l-8}" y="${y+4}" text-anchor="end" font-size="11"
      fill="var(--muted)" font-variant-numeric="tabular-nums">${v.toFixed(1).replace(".",",")}%</text>`;
  });
  entries.forEach(([k,v],i)=>{
    const x=m.l+(i+0.5)*(W-m.l-m.r)/entries.length-bw/2;
    const y0=Y(0), y1=Y(v);
    const top=Math.min(y0,y1), h=Math.max(2,Math.abs(y1-y0));
    bars+=`<path d="${roundedBar(x,top,bw,h,4,v>=0)}"
      fill="${v>=0?"var(--s1)":"var(--neg)"}" data-k="${k}" data-v="${v}"/>`;
    labels+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11"
      fill="var(--muted)">${k.slice(5)}/${k.slice(2,4)}</text>`;
  });
  panel.insertAdjacentHTML("beforeend",
    `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Rendimenti mensili">
      ${grid}${bars}${labels}</svg><div class="tip" id="moTip"></div>`);
  const svg=panel.querySelector("svg"), tip=panel.querySelector("#moTip");
  svg.querySelectorAll("path").forEach(p=>{
    p.addEventListener("mousemove",e=>{
      const r=svg.getBoundingClientRect();
      tip.style.display="block";
      tip.style.left=Math.min(e.clientX-r.left+12,r.width-130)+"px";
      tip.style.top=(e.clientY-r.top-34)+"px";
      const v=parseFloat(p.dataset.v);
      tip.innerHTML=`${p.dataset.k} · <b class="${cls(v)}">${fmtPct(v)}</b>`;
    });
    p.addEventListener("mouseleave",()=>tip.style.display="none");
  });
}

function roundedBar(x,y,w,h,r,up){
  r=Math.min(r,h,w/2);
  return up
    ? `M${x} ${y+h} L${x} ${y+r} Q${x} ${y} ${x+r} ${y} L${x+w-r} ${y} Q${x+w} ${y} ${x+w} ${y+r} L${x+w} ${y+h} Z`
    : `M${x} ${y} L${x+w} ${y} L${x+w} ${y+h-r} Q${x+w} ${y+h} ${x+w-r} ${y+h} L${x+r} ${y+h} Q${x} ${y+h} ${x} ${y+h-r} Z`;
}

main();
</script>
</body>
</html>
